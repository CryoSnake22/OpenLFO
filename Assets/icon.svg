<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b9eff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#3b9eff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6cb8ff"/>
      <stop offset="1" stop-color="#3b9eff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="plot">
      <rect x="196" y="236" width="632" height="552" rx="44"/>
    </clipPath>
  </defs>

  <!-- Tile: macOS icon grid, 824 px body on a 1024 px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Graph well -->
  <rect x="196" y="236" width="632" height="552" rx="44" fill="#070707"/>
  <g clip-path="url(#plot)">
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="4">
      <line x1="354" y1="236" x2="354" y2="788"/>
      <line x1="512" y1="236" x2="512" y2="788"/>
      <line x1="670" y1="236" x2="670" y2="788"/>
      <line x1="196" y1="374" x2="828" y2="374"/>
      <line x1="196" y1="512" x2="828" y2="512"/>
      <line x1="196" y1="650" x2="828" y2="650"/>
    </g>

    <!-- One LFO cycle: rise, peak, dip, recover -->
    <path d="M196,512 C270,512 286,330 354,330 C452,330 432,694 548,694 C640,694 690,512 828,512 L828,788 L196,788 Z" fill="url(#fill)"/>
    <path d="M196,512 C270,512 286,330 354,330 C452,330 432,694 548,694 C640,694 690,512 828,512" fill="none" stroke="#3b9eff" stroke-opacity="0.55" stroke-width="30" filter="url(#glow)"/>
  </g>
  <rect x="198" y="238" width="628" height="548" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>

  <path d="M196,512 C270,512 286,330 354,330 C452,330 432,694 548,694 C640,694 690,512 828,512" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round"/>

  <!-- Nodes, and one hollow curve handle -->
  <g fill="#3b9eff" stroke="#0a0a0a" stroke-width="10">
    <circle cx="196" cy="512" r="30"/>
    <circle cx="828" cy="512" r="30"/>
  </g>
  <g fill="#f2f2f2" stroke="#0a0a0a" stroke-width="10">
    <circle cx="354" cy="330" r="30"/>
    <circle cx="548" cy="694" r="30"/>
  </g>
  <circle cx="446" cy="512" r="21" fill="#0a0a0a" stroke="#6cb8ff" stroke-width="10"/>
</svg>
